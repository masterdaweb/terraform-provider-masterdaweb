name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      # The docs must match the provider's schema.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: make docs && git diff --exit-code docs/

  # The examples, updates, imports and destroys through Terraform itself
  # (against the fake API: nothing real is made), on the oldest Terraform
  # these tests run on and the newest.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        terraform: ["1.5.7", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: MW_TF_E2E=1 go test ./internal/provider -run ThroughTerraform -v
